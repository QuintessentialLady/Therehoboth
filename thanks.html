<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | Therehoboth</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400&family=Figtree:wght@400;600&display=swap">
<style>
:root{--ivory:#FBF8EF;--ink:#1E3142;--ink-soft:#4D5F6E;--accent:#2F6489;--blue:#D6E7F3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ivory:#131E28;--ink:#F4EFE0;--ink-soft:#B9C2C8;--accent:#A9CDE6;--blue:#1C3243;color-scheme:dark}}
:root[data-theme="dark"]{--ivory:#131E28;--ink:#F4EFE0;--ink-soft:#B9C2C8;--accent:#A9CDE6;--blue:#1C3243;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ivory);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;padding:16px;text-align:center}
h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,5vw,3.2rem);margin:0 0 14px}
p{color:var(--ink-soft);max-width:46ch;margin:0 auto 28px;line-height:1.65}
a{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--ink);color:var(--ivory);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div>
  <h1>Thank you</h1>
  <p>Your enquiry has been sent. We will reply within two working days. If you are in crisis, call 999, NHS 111, or Samaritans on 116 123.</p>

</div>
</body>
</html>
